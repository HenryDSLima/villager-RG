name: Build and Release Fabric Mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test Fabric mod
        run: ./gradlew build --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/villager-rg-*.jar \
            --title "Villager-RG ${GITHUB_REF_NAME} (Minecraft 1.20.1 Fabric)" \
            --notes "## Villager-RG para Minecraft 1.20.1 (Fabric)

          Sistema de Registro Civil para Villagers com CPF válido (Módulo 11), RG, nome por bioma, histórico de profissões, persistência NBT nativa e padrões GoF (Builder, Strategy e Observer).

          ### Requisitos
          - Minecraft Java Edition **1.20.1**
          - **Fabric Loader** >= 0.15.0
          - **Fabric API** (1.20.1)

          ### Instalação
          Baixe o arquivo \`villager-rg-1.0.0.jar\` abaixo (não o \`-sources.jar\`) e coloque na pasta \`.minecraft/mods/\` junto com a Fabric API."
